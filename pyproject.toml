[project]
name = "imephu"
version = "0.12.0"
description = "Finder charts for the Southern African Large Telescope (SALT)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "astropy>=7.2.0",
    "astroquery>=0.4.11",
    "defusedxml>=0.7.1",
    "jsonschema>=4.26.0",
    "matplotlib>=3.10.8",
    "pypdf>=6.10.1",
    "python-dateutil>=2.9.0.post0",
    "pyyaml>=6.0.3",
    "requests>=2.33.1",
    "typer>=0.24.1",
]

[dependency-groups]
dev = [
    "black>=26.3.1",
    "mypy>=1.20.1",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "pytest-regressions>=2.10.0",
    "responses>=0.26.0",
    "ruff>=0.15.10",
    "types-pyyaml>=6.0.12.20260408",
    "types-requests>=2.33.0.20260408",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "B", "I"]
unfixable = ["B"]
ignore = ["E203", "E501"]
dummy-variable-rgx = "^ignore_me$"

[tool.ruff.lint.pydocstyle]
convention = "numpy"
